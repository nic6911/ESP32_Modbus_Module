<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="40" y="52" font-size="32" font-weight="bold" fill="#1a1a1a">Nilan quick-reference card</text>
  <text x="40" y="84" font-size="18" fill="#52616b">Rev2 module · RJ45 only · CTS400, CTS602, CTS602i, CTS602 Light</text>

  <!-- table header -->
  <rect x="30" y="110" width="1040" height="48" rx="6" fill="#005b8f"/>
  <text x="50" y="141" font-size="15" font-weight="bold" fill="#ffffff">Nilan interface</text>
  <text x="285" y="141" font-size="15" font-weight="bold" fill="#ffffff">A</text>
  <text x="345" y="141" font-size="15" font-weight="bold" fill="#ffffff">B</text>
  <text x="405" y="141" font-size="15" font-weight="bold" fill="#ffffff">GND</text>
  <text x="485" y="141" font-size="15" font-weight="bold" fill="#ffffff">+12 V</text>
  <text x="585" y="141" font-size="15" font-weight="bold" fill="#ffffff">Module A</text>
  <text x="690" y="141" font-size="15" font-weight="bold" fill="#ffffff">Module B</text>
  <text x="795" y="141" font-size="15" font-weight="bold" fill="#ffffff">Module GND</text>
  <text x="920" y="141" font-size="15" font-weight="bold" fill="#ffffff">Power</text>

  <!-- rows -->
  <rect x="30" y="158" width="1040" height="52" fill="#f4f8fb"/>
  <text x="50" y="190" font-size="16" font-weight="bold" fill="#1a1a1a">CTS400 RJ45</text>
  <text x="290" y="190" font-size="17" fill="#1a1a1a">4</text>
  <text x="350" y="190" font-size="17" fill="#1a1a1a">5</text>
  <text x="410" y="190" font-size="17" fill="#1a1a1a">1</text>
  <text x="500" y="190" font-size="17" fill="#9e9e9e">—</text>
  <text x="610" y="190" font-size="17" fill="#1a1a1a">6</text>
  <text x="715" y="190" font-size="17" fill="#1a1a1a">3</text>
  <text x="825" y="190" font-size="17" fill="#1a1a1a">1/2</text>
  <text x="920" y="190" font-size="16" font-weight="bold" fill="#005b8f">USB-C</text>

  <rect x="30" y="210" width="1040" height="52" fill="#ffffff"/>
  <text x="50" y="242" font-size="16" font-weight="bold" fill="#1a1a1a">CTS602 RJ45 outlet</text>
  <text x="290" y="242" font-size="17" fill="#1a1a1a">4</text>
  <text x="350" y="242" font-size="17" fill="#1a1a1a">5</text>
  <text x="410" y="242" font-size="17" fill="#1a1a1a">1</text>
  <text x="500" y="242" font-size="17" fill="#9e9e9e">—</text>
  <text x="610" y="242" font-size="17" fill="#1a1a1a">6</text>
  <text x="715" y="242" font-size="17" fill="#1a1a1a">3</text>
  <text x="825" y="242" font-size="17" fill="#1a1a1a">1/2</text>
  <text x="920" y="242" font-size="16" font-weight="bold" fill="#005b8f">USB-C</text>

  <rect x="30" y="262" width="1040" height="52" fill="#f4f8fb"/>
  <text x="50" y="294" font-size="16" font-weight="bold" fill="#1a1a1a">CTS602 6-pin plug</text>
  <text x="290" y="294" font-size="17" fill="#1a1a1a">2</text>
  <text x="350" y="294" font-size="17" fill="#1a1a1a">3</text>
  <text x="410" y="294" font-size="17" fill="#1a1a1a">6</text>
  <text x="495" y="294" font-size="17" fill="#1a1a1a">1</text>
  <text x="610" y="294" font-size="17" fill="#1a1a1a">6</text>
  <text x="715" y="294" font-size="17" fill="#1a1a1a">3</text>
  <text x="825" y="294" font-size="17" fill="#1a1a1a">1/2</text>
  <text x="920" y="294" font-size="16" font-weight="bold" fill="#8a4b08">12 V / USB-C</text>

  <rect x="30" y="314" width="1040" height="52" fill="#ffffff"/>
  <text x="50" y="346" font-size="16" font-weight="bold" fill="#1a1a1a">CTS602 8-pin plug</text>
  <text x="290" y="346" font-size="17" fill="#1a1a1a">6</text>
  <text x="350" y="346" font-size="17" fill="#1a1a1a">7</text>
  <text x="410" y="346" font-size="17" fill="#1a1a1a">1</text>
  <text x="495" y="346" font-size="17" fill="#1a1a1a">8</text>
  <text x="610" y="346" font-size="17" fill="#1a1a1a">6</text>
  <text x="715" y="346" font-size="17" fill="#1a1a1a">3</text>
  <text x="825" y="346" font-size="17" fill="#1a1a1a">1/2</text>
  <text x="920" y="346" font-size="16" font-weight="bold" fill="#8a4b08">12 V / USB-C</text>

  <rect x="30" y="366" width="1040" height="52" fill="#f4f8fb"/>
  <text x="50" y="398" font-size="16" font-weight="bold" fill="#1a1a1a">CTS602 terminal block</text>
  <text x="290" y="398" font-size="17" fill="#1a1a1a">2</text>
  <text x="350" y="398" font-size="17" fill="#1a1a1a">3</text>
  <text x="410" y="398" font-size="17" fill="#1a1a1a">6</text>
  <text x="495" y="398" font-size="17" fill="#1a1a1a">1</text>
  <text x="610" y="398" font-size="17" fill="#1a1a1a">6</text>
  <text x="715" y="398" font-size="17" fill="#1a1a1a">3</text>
  <text x="825" y="398" font-size="17" fill="#1a1a1a">1/2</text>
  <text x="920" y="398" font-size="16" font-weight="bold" fill="#8a4b08">12 V / USB-C</text>

  <!-- T568B strip -->
  <rect x="30" y="450" width="1040" height="120" rx="10" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="2"/>
  <text x="54" y="482" font-size="19" font-weight="bold" fill="#1a1a1a">T568B wire colours</text>
  <rect x="54" y="500" width="90" height="26" rx="4" fill="#4caf50" stroke="#2e7d32"/>
  <text x="99" y="519" text-anchor="middle" font-size="14" fill="#ffffff">A</text>
  <text x="160" y="519" font-size="16" fill="#1a1a1a">green</text>
  <rect x="260" y="500" width="90" height="26" rx="4" fill="#a5d6a7" stroke="#4b8b4f"/>
  <text x="305" y="519" text-anchor="middle" font-size="14" fill="#1a1a1a">B</text>
  <text x="366" y="519" font-size="16" fill="#1a1a1a">green/white</text>
  <rect x="520" y="500" width="90" height="26" rx="4" fill="#f5a623" stroke="#b97a10"/>
  <text x="565" y="519" text-anchor="middle" font-size="14" fill="#ffffff">GND</text>
  <text x="626" y="519" font-size="16" fill="#1a1a1a">orange/white + orange</text>
  <rect x="810" y="500" width="90" height="26" rx="4" fill="#795548" stroke="#4e342e"/>
  <text x="855" y="519" text-anchor="middle" font-size="14" fill="#ffffff">+12 V</text>
  <text x="916" y="519" font-size="16" fill="#1a1a1a">brown/white + brown</text>
  <text x="54" y="552" font-size="15" fill="#52616b">For T568A, A = orange, B = orange/white, GND = green/white + green.</text>

  <!-- warnings -->
  <rect x="30" y="600" width="510" height="120" rx="10" fill="#fff4f4" stroke="#d32f2f" stroke-width="2"/>
  <text x="54" y="632" font-size="18" font-weight="bold" fill="#b00020">Never do this</text>
  <text x="54" y="660" font-size="16" fill="#5c1b1b">• Do not use a straight Nilan/Ethernet cable.</text>
  <text x="54" y="686" font-size="16" fill="#5c1b1b">• Do not connect 12 V to A or B.</text>
  <text x="54" y="712" font-size="16" fill="#5c1b1b">• Do not run the module and Nilan Gateway together.</text>

  <rect x="560" y="600" width="510" height="120" rx="10" fill="#f2f7fb" stroke="#0085CA" stroke-width="2"/>
  <text x="584" y="632" font-size="18" font-weight="bold" fill="#005b8f">Always</text>
  <text x="584" y="660" font-size="16" fill="#20313b">• Connect GND between the unit and the module.</text>
  <text x="584" y="686" font-size="16" fill="#20313b">• Use one power source.</text>
  <text x="584" y="712" font-size="16" fill="#20313b">• Check the Nilan software version.</text>
</svg>
