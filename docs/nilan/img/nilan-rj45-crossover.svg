<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="790" fill="#ffffff"/>
  <text x="40" y="52" font-size="32" font-weight="bold" fill="#1a1a1a">Nilan RJ45 → module RJ45 crossover</text>
  <text x="40" y="84" font-size="19" fill="#52616b">Use this when the Nilan unit has an RJ45 Modbus socket (CTS400, CTS602 RJ45, or Nilan Gateway).</text>

  <!-- Nilan connector -->
  <rect x="100" y="130" width="180" height="470" rx="12" fill="#eef3f7" stroke="#7a8a99" stroke-width="2"/>
  <text x="190" y="162" text-anchor="middle" font-size="20" font-weight="bold" fill="#005b8f">Nilan RJ45</text>

  <text x="120" y="213" font-size="18" font-weight="bold" fill="#1a1a1a">1</text>
  <rect x="145" y="192" width="110" height="30" rx="4" fill="#f5a623" stroke="#b97a10"/>
  <text x="200" y="213" text-anchor="middle" font-size="14" fill="#ffffff">GND</text>

  <text x="120" y="263" font-size="18" fill="#9e9e9e">2</text>
  <rect x="145" y="242" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="200" y="263" text-anchor="middle" font-size="14" fill="#9e9e9e">—</text>

  <text x="120" y="313" font-size="18" fill="#9e9e9e">3</text>
  <rect x="145" y="292" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="200" y="313" text-anchor="middle" font-size="14" fill="#9e9e9e">—</text>

  <text x="120" y="363" font-size="18" font-weight="bold" fill="#1a1a1a">4</text>
  <rect x="145" y="342" width="110" height="30" rx="4" fill="#4caf50" stroke="#2e7d32"/>
  <text x="200" y="363" text-anchor="middle" font-size="14" fill="#ffffff">A</text>

  <text x="120" y="413" font-size="18" font-weight="bold" fill="#1a1a1a">5</text>
  <rect x="145" y="392" width="110" height="30" rx="4" fill="#a5d6a7" stroke="#4b8b4f"/>
  <text x="200" y="413" text-anchor="middle" font-size="14" fill="#1a1a1a">B</text>

  <text x="120" y="463" font-size="18" fill="#9e9e9e">6</text>
  <rect x="145" y="442" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="200" y="463" text-anchor="middle" font-size="14" fill="#9e9e9e">—</text>

  <text x="120" y="513" font-size="18" fill="#9e9e9e">7</text>
  <rect x="145" y="492" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="200" y="513" text-anchor="middle" font-size="14" fill="#9e9e9e">—</text>

  <text x="120" y="563" font-size="18" fill="#9e9e9e">8</text>
  <rect x="145" y="542" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="200" y="563" text-anchor="middle" font-size="14" fill="#9e9e9e">—</text>

  <!-- Module connector -->
  <rect x="820" y="130" width="180" height="470" rx="12" fill="#eef3f7" stroke="#7a8a99" stroke-width="2"/>
  <text x="910" y="162" text-anchor="middle" font-size="20" font-weight="bold" fill="#005b8f">Module RJ45</text>

  <text x="840" y="213" font-size="18" font-weight="bold" fill="#1a1a1a">1</text>
  <rect x="865" y="192" width="110" height="30" rx="4" fill="#f5a623" stroke="#b97a10"/>
  <text x="920" y="213" text-anchor="middle" font-size="14" fill="#ffffff">GND</text>

  <text x="840" y="263" font-size="18" font-weight="bold" fill="#1a1a1a">2</text>
  <rect x="865" y="242" width="110" height="30" rx="4" fill="#f5c46b" stroke="#b98a2e"/>
  <text x="920" y="263" text-anchor="middle" font-size="14" fill="#1a1a1a">GND</text>

  <text x="840" y="313" font-size="18" font-weight="bold" fill="#1a1a1a">3</text>
  <rect x="865" y="292" width="110" height="30" rx="4" fill="#a5d6a7" stroke="#4b8b4f"/>
  <text x="920" y="313" text-anchor="middle" font-size="14" fill="#1a1a1a">B</text>

  <text x="840" y="363" font-size="18" fill="#9e9e9e">4</text>
  <rect x="865" y="342" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="920" y="363" text-anchor="middle" font-size="14" fill="#9e9e9e">not used</text>

  <text x="840" y="413" font-size="18" fill="#9e9e9e">5</text>
  <rect x="865" y="392" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="920" y="413" text-anchor="middle" font-size="14" fill="#9e9e9e">not used</text>

  <text x="840" y="463" font-size="18" font-weight="bold" fill="#1a1a1a">6</text>
  <rect x="865" y="442" width="110" height="30" rx="4" fill="#4caf50" stroke="#2e7d32"/>
  <text x="920" y="463" text-anchor="middle" font-size="14" fill="#ffffff">A</text>

  <text x="840" y="513" font-size="18" fill="#9e9e9e">7</text>
  <rect x="865" y="492" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="920" y="513" text-anchor="middle" font-size="14" fill="#9e9e9e">+12 V</text>

  <text x="840" y="563" font-size="18" fill="#9e9e9e">8</text>
  <rect x="865" y="542" width="110" height="30" rx="4" fill="#e0e0e0" stroke="#bdbdbd"/>
  <text x="920" y="563" text-anchor="middle" font-size="14" fill="#9e9e9e">+12 V</text>

  <!-- wires -->
  <path d="M 255 207 L 865 207" fill="none" stroke="#f5a623" stroke-width="6"/>
  <path d="M 255 357 L 865 457" fill="none" stroke="#4caf50" stroke-width="6"/>
  <path d="M 255 407 L 865 307" fill="none" stroke="#a5d6a7" stroke-width="6"/>
  <path d="M 865 207 L 865 257" fill="none" stroke="#f5a623" stroke-width="6"/>

  <text x="560" y="194" text-anchor="middle" font-size="17" font-weight="bold" fill="#b97a10">GND: Nilan 1 → module 1 + 2</text>
  <text x="560" y="447" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">A: Nilan 4 → module 6</text>
  <text x="560" y="327" text-anchor="middle" font-size="17" font-weight="bold" fill="#4b8b4f">B: Nilan 5 → module 3</text>

  <text x="100" y="628" font-size="17" fill="#20313b">The Nilan Gateway's Modbus port uses the same Nilan pinout: 4 = A, 5 = B, 1 = GND.</text>
  <text x="100" y="658" font-size="17" fill="#20313b">Unplug the Nilan Gateway before you connect the module.</text>

  <rect x="100" y="684" width="900" height="82" rx="10" fill="#fff4f4" stroke="#d32f2f" stroke-width="2"/>
  <text x="124" y="714" font-size="18" font-weight="bold" fill="#b00020">A straight cable connects Nilan 4 → module 4 and Nilan 5 → module 5.</text>
  <text x="124" y="742" font-size="18" font-weight="bold" fill="#b00020">The module does not use pins 4/5 for Modbus, so it will not communicate.</text>
</svg>
